# Futóedzés-tervező – fejlesztői és demó környezet.
# Indítás a repó gyökeréből: docker compose up --build
# A jelszavak csak helyi fejlesztésre valók.

name: futoedzes

services:
  # API Gateway: minden kérés a http://localhost-on át érkezik, útvonal alapján továbbítva.
  traefik:
    image: traefik:v3.7.19
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "8090:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  keycloak-db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Identitáskezelő a http://localhost/auth címen; a futoedzes realm induláskor importálódik.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_RELATIVE_PATH: /auth
      # A tokenek kibocsátója mindig a publikus cím, a szolgáltatások viszont a belső
      # http://keycloak:8080 címen kérik le a kulcsokat (backchannel).
      KC_HOSTNAME: http://localhost/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=PathPrefix(`/auth`)
      - traefik.http.routers.keycloak.entrypoints=web
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

  rabbitmq:
    image: rabbitmq:4.4.0-management
    environment:
      RABBITMQ_DEFAULT_USER: futoedzes
      RABBITMQ_DEFAULT_PASS: futoedzes
    ports:
      - "5672:5672"
      - "15672:15672" # RabbitMQ management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  analytics-db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5443:5432" # helyi `dotnet run`-hoz
    volumes:
      - analytics-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Terhelési mutatók, kockázati pontszám. Útvonal: http://localhost/api/analytics
  analytics-api:
    build:
      context: ./backend
      dockerfile: src/Analytics.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=analytics-db;Database=analytics;Username=analytics;Password=analytics
      RabbitMq__Host: rabbitmq
      Keycloak__MetadataAddress: http://keycloak:8080/auth/realms/futoedzes/.well-known/openid-configuration
    depends_on:
      analytics-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.analytics.rule=PathPrefix(`/api/analytics`)
      - traefik.http.routers.analytics.entrypoints=web
      - traefik.http.services.analytics.loadbalancer.server.port=8080

  training-db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: training
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training
    ports:
      - "5442:5432" # helyi `dotnet run`-hoz
    volumes:
      - training-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d training"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Edzések, célok, edzéstervek. Útvonal: http://localhost/api/training
  training-api:
    build:
      context: ./backend
      dockerfile: src/Training.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=training-db;Database=training;Username=training;Password=training
      RabbitMq__Host: rabbitmq
      Keycloak__MetadataAddress: http://keycloak:8080/auth/realms/futoedzes/.well-known/openid-configuration
    depends_on:
      training-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.training.rule=PathPrefix(`/api/training`)
      - traefik.http.routers.training.entrypoints=web
      - traefik.http.services.training.loadbalancer.server.port=8080

  identity-db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "5441:5432" # helyi `dotnet run`-hoz
    volumes:
      - identity-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Edzői meghívások és edző–futó kapcsolatok. Útvonal: http://localhost/api/identity
  identity-api:
    build:
      context: ./backend
      dockerfile: src/Identity.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=identity-db;Database=identity;Username=identity;Password=identity
      RabbitMq__Host: rabbitmq
      Keycloak__MetadataAddress: http://keycloak:8080/auth/realms/futoedzes/.well-known/openid-configuration
    depends_on:
      identity-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.identity.rule=PathPrefix(`/api/identity`)
      - traefik.http.routers.identity.entrypoints=web
      - traefik.http.services.identity.loadbalancer.server.port=8080

volumes:
  analytics-db-data:
  keycloak-db-data:
  training-db-data:
  identity-db-data:
