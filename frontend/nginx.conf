server {
    listen 80;
    root /usr/share/nginx/html;

    # Egyoldalas alkalmazás: az ismeretlen útvonalakat (pl. /coach/runners/...) a React router kezeli.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A Vite a fájlnévbe teszi a tartalom hash-ét, így ezek sokáig gyorsítótárazhatók.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
